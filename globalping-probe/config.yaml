# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Globalping Probe
version: "0.52.1"
slug: globalping-probe
description: Run a Globalping network probe and contribute to the global measurement network
url: "https://github.com/fmurodov/hassio-apps/tree/main/globalping-probe"
arch:
  - aarch64
  - amd64
init: false
host_network: true
privileged:
  - NET_RAW
options:
  adoption_token: ""
  log_level: info
schema:
  adoption_token: password?
  log_level: list(trace|debug|info|notice|warning|error|fatal)
image: "ghcr.io/fmurodov/hassio-apps/globalping-probe"
